# .github/workflows/veille.yml
name: Veille Catawiki
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  veille:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install curl_cffi
      - run: python veille_catawiki.py
        env:
          EMAIL: ${{ secrets.EMAIL }}
          EMAIL_MDP_APPLI: ${{ secrets.EMAIL_MDP_APPLI }}
      - run: |
          git config user.name "robot"
          git config user.email "robot@users.noreply.github.com"
          git add lots_deja_vus.json || true
          git commit -m "lots vus" || true
          git push || true
